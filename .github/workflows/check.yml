name: check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq npm

      - name: Run repo checks
        run: just check

      - name: Build container image
        run: just build

      - name: Verify image labels
        run: |
          labels="$(docker image inspect nyx:latest --format '{{json .Config.Labels}}')"
          echo "$labels"
          echo "$labels" | grep -q '"io.github.netlooker.nyx.build-info":"/app/build-info.json"'
          echo "$labels" | grep -q '"io.github.netlooker.nyx.openclaw.version":'
          echo "$labels" | grep -q '"io.github.netlooker.nyx.qwen-code.version":'
          echo "$labels" | grep -q '"io.github.netlooker.nyx.scrapling.version":'
          echo "$labels" | grep -q '"io.github.netlooker.nyx.synapse.version":'
          echo "$labels" | grep -q '"io.github.netlooker.nyx.sonar.version":'

      - name: Verify build metadata artifact
        run: |
          cid="$(docker create nyx:latest)"
          docker cp "$cid:/app/build-info.json" ./build-info.json
          docker rm "$cid"
          cat build-info.json
          grep -q '"resolved"' build-info.json
